<section id="area-cadastro">
  <h2>Formulário de Cadastro</h2>
  
  <!-- O formulário começa aqui. Adicionamos o ID para o JavaScript capturar o evento -->
  <form id="form-cadastro" action="#" method="POST">
    
    <!-- Agrupamento de Dados Pessoais -->
    <fieldset>
      <legend>Dados Pessoais</legend>
      
      <label for="nome">Nome Completo:</label>
      <input type="text" id="nome" name="nome" required minlength="3">
      
      <label for="data-nascimento">Data de Nascimento:</label>
      <input type="date" id="data-nascimento" name="data-nascimento" required>
      
      <label for="cpf">CPF:</label>
      <!-- O atributo pattern força a máscara do CPF: 000.000.000-00 -->
      <input type="text" id="cpf" name="cpf" required pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" placeholder="000.000.000-00" title="Digite no formato 000.000.000-00">
    </fieldset>

    <!-- Agrupamento de Contato -->
    <fieldset>
      <legend>Contato e Endereço</legend>
      
      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required>
      
      <label for="telefone">Telefone/WhatsApp:</label>
      <!-- O atributo pattern força a máscara do telefone: (00) 00000-0000 -->
      <input type="tel" id="telefone" name="telefone" required pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}" placeholder="(00) 00000-0000" title="Digite no formato (00) 00000-0000">
      
      <label for="cep">CEP:</label>
      <!-- O atributo pattern força a máscara do CEP: 00000-000 -->
      <input type="text" id="cep" name="cep" required pattern="[0-9]{5}-[0-9]{3}" placeholder="00000-000" title="Digite no formato 00000-000">
    </fieldset>

    <button type="submit">Enviar Cadastro</button>
  </form>
</section>
